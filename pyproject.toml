[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certledger"
description = "Local cryptographic asset ledger: which certificates and private keys live on this machine, and which pairs with which."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["x509", "certificates", "private-keys", "inventory", "offline", "cli", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = ["cryptography>=42"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
certledger = "certledger.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/10-21-certledger"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "certledger.__version__" }

[tool.setuptools.package-data]
certledger = ["data/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "system: touches the host certificate store or an external binary (not run in CI by default)",
  "posix_only: POSIX-only permission semantics (skipped on Windows)",
]
